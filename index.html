<style>
/* ============================================================
   BSC / CFS — board document index
   tokens
   ============================================================ */
:root{
  --bg:#0B0B0B;      /* page */
  --fg:#D6D6D0;      /* text */
  --g:#8A8A84;       /* muted — lifted for the lighter panel (was #6A6A64) */
  --d:#1C1C1A;       /* hairline */
  --r:#D2402C;       /* fixed red — flags only, never cycles */
  --h:0;             /* live hue, written by the field engine */
  --hc:hsl(var(--h) 88% 62%);
  --edge:#4E4E48;    /* control border — must read against the panel, not the page */
  --lead:#2E2E2A;    /* dotted leader */
  --pan:.78;         /* reading-panel opacity */
  --inset:88px;      /* reading column inset / panel feather */
  --chh:44px;        /* header height — measured at runtime */
  --stick:44px;      /* header + open drawer — where the rail parks */
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11.5px;line-height:1.6}

/* the animated field sits behind everything and scrolls with the page */
#dz{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block}
.chrome,.settings,.field,.ctl,.wrap{position:relative;z-index:1}

:focus-visible{outline:1px solid var(--hc);outline-offset:2px}

/* ============================================================
   chrome
   ============================================================ */
.chrome{position:sticky;top:0;z-index:11;padding:0 16px}
.chromein{display:flex;justify-content:space-between;align-items:center;gap:24px;
  flex-wrap:wrap;max-width:1368px;margin:0 auto;padding:11px var(--inset)}

/* ---- surface A · flush: the header wears the same panel as the rail, so the
   two read as one slab with a hairline through it ---- */
[data-hdr=flush] .chromein{
  border-bottom:1px solid var(--d);
  background:linear-gradient(90deg,rgba(11,11,11,0) 0,rgba(11,11,11,var(--pan)) var(--inset),
    rgba(11,11,11,var(--pan)) calc(100% - var(--inset)),rgba(11,11,11,0) 100%)}

/* ---- surface B · solid: the rail comes up to meet the header instead —
   both full-bleed and opaque, content still aligned to the column ---- */
[data-hdr=solid] .chrome{background:var(--bg);border-bottom:1px solid var(--d)}
[data-hdr=solid] .ctl{background:var(--bg);border-bottom:1px solid var(--d)}
[data-hdr=solid] .ctlin:before{display:none}
.home{display:flex;align-items:center;gap:9px;color:var(--fg);text-decoration:none;
  font-size:10px;letter-spacing:.22em;text-transform:uppercase;white-space:nowrap;padding:3px 8px}
.home i{width:9px;height:9px;background:var(--hc);display:block;flex:0 0 9px}
.home span{color:var(--g)}
.home:hover{color:var(--hc)}

.util{display:flex;align-items:center;gap:14px;font-size:10px;letter-spacing:.1em;color:var(--g)}
.util button{background:0;border:0;color:var(--g);font-family:inherit;font-size:10px;
  letter-spacing:.1em;cursor:pointer;padding:3px 8px}
.util button:hover{color:var(--fg)}
.util #setbtn[aria-expanded=true]{color:var(--fg)}
#clk{padding:3px 8px;font-variant-numeric:tabular-nums}

/* dropdown menus — open down, flip up, cap their height when squeezed */
.dd{position:relative;display:flex}
.dd>button{display:flex;align-items:center;gap:9px;border:1px solid var(--edge);background:var(--bg);
  color:var(--fg);font-family:inherit;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
  padding:5px 11px;cursor:pointer;line-height:1.2;white-space:nowrap}
.dd>button:hover{border-color:var(--g)}
.dd>button[aria-expanded=true]{border-color:var(--hc)}
.dd>button .cv{font-size:8px;color:var(--g);margin-left:2px}
.ms{width:18px;height:11px;border:1px solid var(--d);display:block;flex:0 0 18px}

.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:20;background:var(--bg);overflow:auto;
  border:1px solid var(--d);min-width:186px;padding:3px;display:flex;flex-direction:column;
  box-shadow:0 8px 30px rgba(0,0,0,.6)}
.menu.up{top:auto;bottom:calc(100% + 6px);box-shadow:0 -8px 30px rgba(0,0,0,.6)}
.menu[hidden]{display:none}
.menu button{display:flex;align-items:center;gap:10px;border:0;background:0;color:var(--g);
  font-family:inherit;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  padding:6px 9px;cursor:pointer;text-align:left;width:100%}
.menu button:hover,.menu button.cue{background:rgba(255,255,255,.06);color:var(--fg)}
.menu button[aria-selected=true]{color:var(--fg)}
#modemenu button[aria-selected=true]:after{content:"\2022";margin-left:auto;color:var(--hc)}
.dd .bx{width:8px;height:8px;border:1px solid var(--g);flex:0 0 8px;display:block}
.dd .bx.on{background:var(--hc);border-color:var(--hc)}
.menu button b{margin-left:auto;font-weight:400;color:var(--g);font-size:9px}
.dd>button b{font-weight:400;color:var(--hc);font-size:9.5px}
.menu .sep{border:0;border-top:1px solid var(--d);margin:3px 1px}
.menu .cap{font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:var(--g);
  padding:5px 9px 3px;opacity:.7}
.menu .dsw{gap:10px}
.menu .dsw .bx{width:8px;height:8px;border:1px solid var(--g);flex:0 0 8px;display:block}
.menu .dsw .bx.on{background:var(--hc);border-color:var(--hc)}
.menu .dsw[aria-pressed=true]{color:var(--fg)}

/* settings drawer */
.settings{border-bottom:1px solid var(--d);padding:13px 16px;display:flex;
  position:sticky;top:var(--chh);z-index:10;
  flex-direction:column;gap:11px;background:var(--bg)}
.settings[hidden]{display:none}
.srow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.slbl{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--g);
  flex:0 0 64px;padding:2px 6px}
.swrow{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.mkb{border:1px solid var(--d);background:0;color:var(--g);font-family:inherit;font-size:9.5px;
  letter-spacing:.14em;text-transform:uppercase;cursor:pointer;padding:5px 10px}
.mkb:hover{color:var(--fg);border-color:var(--g)}
.mkb[aria-pressed=true]{background:var(--fg);border-color:var(--fg);color:var(--bg)}

/* ============================================================
   hero
   ============================================================ */
/* the gap under the title block is the hero's lower half; this doubles it
   without moving the title or growing the space above it */
.field{height:clamp(180px,44vh,620px);margin-bottom:clamp(20px,12vh,150px);overflow:visible}
.htitle{position:absolute;z-index:2;left:34px;top:50%;transform:translateY(-50%);
  max-width:calc(100% - 68px)}
.htitle div{display:block;line-height:0}
.htitle span{display:inline-block;background:var(--bg);border:1px solid var(--d);
  margin-bottom:4px;line-height:1.2}
.htitle .e{font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--g);padding:5px 10px}
.htitle .t{font-size:clamp(17px,3.4vw,38px);letter-spacing:.14em;text-transform:uppercase;
  color:var(--fg);font-weight:500;padding:7px 13px}
.htitle .s{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--g);padding:5px 10px}

/* ============================================================
   control bar
   ============================================================ */
.ctl{position:sticky;top:var(--stick);z-index:9;padding:0 16px}
/* the rail carries the same panel weight as the list below it, so the two read
   as one surface. the panel and its blur both live on a pseudo-element carrying
   the same horizontal mask, so the blur feathers out exactly where the panel
   does instead of ending on a hard vertical cut in the margin. */
.ctlin{display:flex;gap:20px;align-items:center;flex-wrap:wrap;position:relative;
  max-width:1368px;margin:0 auto;padding:9px var(--inset) 10px}
.ctlin:before{content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(90deg,rgba(11,11,11,0) 0,rgba(11,11,11,var(--pan)) var(--inset),
    rgba(11,11,11,var(--pan)) calc(100% - var(--inset)),rgba(11,11,11,0) 100%);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 var(--inset),
    #000 calc(100% - var(--inset)),transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 var(--inset),
    #000 calc(100% - var(--inset)),transparent 100%)}

.sb{position:relative;display:flex;align-items:center;gap:9px;border:1px solid var(--edge);height:32px;
  padding:0 11px;flex:1 1 260px;max-width:430px;background:0}
.sb .pr{color:var(--g)}
.sb:focus-within{border-color:var(--hc)}
.sb:focus-within .pr{color:var(--hc)}
#q{flex:1;border:0;outline:0;background:0;color:var(--fg);font-family:inherit;font-size:11.5px;min-width:0}
#q::placeholder{color:var(--g)}
#clear{display:none;border:0;background:0;color:var(--r);font-family:inherit;font-size:10px;
  letter-spacing:.1em;cursor:pointer;padding:0}
.sb.has #clear{display:block}

#filtmenu{min-width:198px}
#filtmenu button{font-size:10.5px;letter-spacing:.06em;text-transform:none}
.cnt{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--g);
  margin-left:auto;white-space:nowrap}

/* animated stipple rule — inset to the rail, not the full viewport */
.ctlin:after{content:"";position:absolute;left:var(--inset);right:var(--inset);bottom:0;height:2px;
  background-image:repeating-linear-gradient(90deg,var(--hc) 0 1px,transparent 1px 4px);
  background-size:4px 100%;animation:stipR 2.7s linear infinite}

/* ============================================================
   reading column
   ============================================================ */
.wrap{max-width:1400px;margin:0 auto;padding:0 16px 70px}
#res,footer{padding-left:var(--inset);padding-right:var(--inset);
  background:linear-gradient(90deg,rgba(11,11,11,0) 0,rgba(11,11,11,var(--pan)) var(--inset),
    rgba(11,11,11,var(--pan)) calc(100% - var(--inset)),rgba(11,11,11,0) 100%)}
/* the list starts clear of the rail rather than tucked straight under it —
   only the first section moves; the gaps between sections are unchanged */
#res{padding-top:30px;padding-bottom:18px}

section{margin-top:38px}
.sh{display:flex;gap:12px;font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--g);padding-bottom:8px;position:relative}
.sh b{flex:0 1 auto;margin-right:auto;color:var(--fg);font-weight:400;padding:2px 0}
.sh span{padding:2px 0}
.sh span:first-child{color:var(--hc)}
.sh:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;opacity:.85;
  background-image:repeating-linear-gradient(90deg,var(--hc) 0 1px,transparent 1px 4px);
  background-size:4px 100%;animation:stipL 3.6s linear infinite}

.doc{display:block;padding:7px 0;--mx:50%;--mh:0}
.hit{display:block;text-decoration:none;color:inherit}
/* the only resting cue that these eighteen titles are links — the hover prism
   below does nothing on a touch screen */
.doc .t{text-decoration:underline;text-decoration-style:dotted;
  text-decoration-color:#3C3C38;text-underline-offset:3px}
.doc:hover .t{text-decoration-color:hsl(var(--mh) 72% 46%)}
.hit:active{background:rgba(255,255,255,.07)}
.doc:hover{background:radial-gradient(230px 130% at var(--mx) 50%,
  hsl(var(--mh) 92% 58%/.20),hsl(var(--mh) 92% 58%/.05) 46%,transparent 72%)}
.doc:hover .t{color:hsl(var(--mh) 88% 68%)}
.doc:hover .ix{color:hsl(var(--mh) 80% 60%)}
.doc:hover .lead{border-bottom-color:hsl(var(--mh) 72% 46%)}
.line{display:flex;align-items:baseline;gap:10px}
.ix{color:var(--g);font-size:10px;flex:0 0 22px}
.t{margin:0;font-size:11.5px;line-height:1.5;flex:0 1 auto}
.lead{flex:1 1 auto;border-bottom:1px dotted var(--lead);transform:translateY(-3px);min-width:20px}
.tag{font-size:10px;letter-spacing:.1em;color:var(--g);white-space:nowrap}
.tag.open:before{content:"[+] "}
.tag.board:before{content:"[!] "}
.tag.gated:before{content:"[?] "}
.tag.unknown:before{content:"[ ] "}
.tag.open{color:#7FE0AE}
.tag.board{color:#FF6B4A}
.tag.gated{color:#F5D74A}
.k{color:var(--g);font-size:10px;margin:1px 0 0 32px;display:flex;align-items:center;gap:12px}
.cp{border:0;background:0;color:var(--g);font-family:inherit;font-size:9.5px;
  letter-spacing:.12em;text-transform:uppercase;cursor:pointer;padding:2px 6px;
  opacity:0;transition:opacity .12s}
.doc:hover .cp,.cp:focus-visible{opacity:1}
.cp:hover{color:var(--fg);background:rgba(255,255,255,.06)}
.cp.ok{color:var(--hc);opacity:1}
@media (hover:none){.cp{opacity:1}}
#copyall{border:1px solid var(--edge);background:0;color:var(--g);font-family:inherit;
  font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;padding:6px 11px;
  white-space:nowrap}
#copyall:hover{color:var(--fg);border-color:var(--g)}
#copyall.ok{color:var(--hc);border-color:var(--hc)}

/* editorial flag on a document */
.fg{border-left:1px solid var(--g);padding:8px 12px 8px 13px;color:var(--g);font-size:10.5px;
  margin:8px 0 4px 32px;max-width:84ch;background:rgba(255,255,255,.05)}
.fg b{display:block;color:var(--fg);font-weight:400;font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;margin-bottom:3px}

mark{background:var(--r);color:#fff}
.empty{color:var(--g);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  display:inline-block;padding:6px 10px;margin:56px 0}

footer{margin-top:54px;padding-top:14px;padding-bottom:14px;color:var(--g);font-size:9.5px;
  letter-spacing:.14em;text-transform:uppercase;display:flex;justify-content:space-between;
  gap:16px;flex-wrap:wrap;position:relative}
footer:after{content:"";position:absolute;left:0;right:0;top:0;height:2px;opacity:.6;
  background-image:repeating-linear-gradient(90deg,var(--hc) 0 1px,transparent 1px 4px);
  background-size:4px 100%;animation:stipR 4.8s linear infinite}

/* adjacent rules drift in opposite directions */
@keyframes stipL{from{background-position:0 0}to{background-position:4px 0}}
@keyframes stipR{from{background-position:0 0}to{background-position:-4px 0}}

/* ============================================================
   responsive / motion / print
   ============================================================ */
@media(max-width:900px){
  :root{--inset:34px}
  .wrap{max-width:100%}
  .ctlin{max-width:100%}
}
@media(max-width:720px){
  .htitle{left:20px;max-width:calc(100% - 40px)}
  .htitle .t{font-size:15px;letter-spacing:.1em;padding:6px 9px}
  .htitle .e,.htitle .s{font-size:8.5px}
  .util{gap:9px}
  .menu{min-width:160px}
}
@media(prefers-reduced-motion:reduce){
  .ctlin:after,.sh:after,footer:after{animation:none}
}
@media print{
  #dz,.settings,.ctl,.util,.field{display:none}
  .ctlin:after,.sh:after,footer:after{display:none}
  body{background:#fff;color:#000}
  #res,footer,.ctlin{background:none;padding-left:0;padding-right:0}
  .chrome{border-color:#ccc;position:static}
  .home,.sh b,.sh span,.t,.ix,.tag,.k,footer{color:#000!important}
  .fg{background:none;border-left:1px solid #000}
  .fg b{color:#000}
  .doc{page-break-inside:avoid}
}
</style>
</head>

<div class="settings" id="settings" hidden>

</div>

<div class="field">

  <div class="htitle">

  </div>
</div>

<div class="ctl"><div class="ctlin">

  <button type="button" id="copyall" title="Copy the visible list as text">copy list</button>

</div></div>

<div class="wrap">
  <div id="res"></div>
  <footer>
    <span>Berkeley Student Cooperative — Central Food Services</span>
    <span>Compiled from the circulated index</span>
  </footer>
</div>

 {t:"KM feedback — anonymized",x:"open",k:"Google Doc",u:"https://docs.google.com/document/d/1KOAOZlH7y1QlPPjgYOscsLR74CKaZ8yAnY0_CFCYcxk/edit?usp=sharing"},

 {t:"KM feedback form responses — copy for the voting board",x:"board",k:"Google Sheet",u:"https://docs.google.com/spreadsheets/d/1j8LAYaZK3USXo0rxws5caozJRZBVOeCratA_4udJStw/edit?usp=sharing"},
 {t:"Email documentation of issues with CFS, from Kitchen Managers",x:"board",k:"Google Doc",u:"https://docs.google.com/document/d/1WBVEv2_gKbPQGoss3ZvMGMC5CjRZLAYWOs0Y9F1Zstw/edit?usp=sharing"}

   ============================================================ */
let tier="all",q="";
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const rex=()=>{const t=q.trim();return t?new RegExp("("+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"):null};
function hl(s){const r=rex(),e=esc(s);return r?e.replace(r,"<mark>$1</mark>"):e}
function hay(d){return [d.t,d.k,TL[d.x],d.fh||"",d.fb||""].join(" ").toLowerCase()}
function match(d){
  const ok=tier==="all"||d.x===tier||(tier==="gated"&&d.x==="unknown");
  const t=q.trim().toLowerCase();
  return ok&&(!t||hay(d).includes(t))}
function counts(){const c={all:ALL.length,open:0,board:0,gated:0};
  ALL.forEach(d=>{d.x==="open"?c.open++:d.x==="board"?c.board++:c.gated++});return c}

const TIERS=[["all","all documents"],["open","open to the public"],
             ["board","board restricted"],["gated","staff and board"]];
function syncFilter(){const c=counts(),m=document.getElementById("filtmenu");
  if(!m.dataset.built){
    m.innerHTML=TIERS.map(([k,l])=>'<button type="button" role="option" data-v="'+k+'" '+
      'aria-selected="'+(k===tier)+'"><i class="bx"></i>'+l+'<b>'+c[k]+'</b></button>').join("");
    m.dataset.built="1"}
  m.querySelectorAll("button[data-v]").forEach(b=>{
    const on=b.dataset.v===tier;
    b.setAttribute("aria-selected",String(on));
    b.querySelector(".bx").classList.toggle("on",on)});
  document.getElementById("filtlbl").textContent=TIERS.find(t=>t[0]===tier)[1];
  document.getElementById("filtn").textContent=c[tier]}

function row(d,i){
  const f=d.fh?'<div class="fg"><b>'+hl(d.fh)+'</b>'+hl(d.fb)+'</div>':'';
  return '<div class="doc">'+
    '<a class="hit" href="'+d.u+'" target="_blank" rel="noopener">'+
    '<span class="line"><span class="ix">'+String(i+1).padStart(2,"0")+'</span>'+
    '<p class="t">'+hl(d.t)+'</p><span class="lead"></span>'+
    '<span class="tag '+d.x+'">'+TS[d.x]+'</span></span></a>'+
    '<p class="k"><span>'+hl(d.k)+'</span>'+
    '<button type="button" class="cp" data-u="'+d.u+'">copy link</button></p>'+f+'</div>'}

function render(){
  syncFilter();let n=0;
  const html=D.map(s=>{
    const ds=s.d.filter(match);if(!ds.length)return"";n+=ds.length;
    return '<section><div class="sh"><span>'+s.s+'</span><b>'+s.h.toLowerCase()+'</b><span>'+ds.length+'</span></div>'+
      ds.map(row).join("")+'</section>'}).join("");
  document.getElementById("res").innerHTML=html||'<div class="empty">no match</div>';
  /* at rest this just repeats the filter button, so it says nothing */
  document.getElementById("cnt").textContent=(q.trim()||tier!=="all")?n+" / "+ALL.length:"";
  if(window.__checkDoc)window.__checkDoc()}

(function wire(){
  const qEl=document.getElementById("q"),sb=document.getElementById("sb"),
        cl=document.getElementById("clear");

  function clear(){q="";qEl.value="";sb.classList.remove("has");render()}

  qEl.addEventListener("input",e=>{q=e.target.value;sb.classList.toggle("has",!!q);render()});
  cl.addEventListener("click",()=>{clear();qEl.focus()});

  qEl.addEventListener("keydown",e=>{
    if(e.key==="Escape"){clear()}
    /* the filtered list is already on screen — Enter takes the top of it */
    else if(e.key==="Enter"){const first=document.querySelector("#res .hit");
      if(first&&q.trim()){e.preventDefault();window.open(first.href,"_blank","noopener")}}});

  document.addEventListener("keydown",e=>{
    if(e.key==="/"&&document.activeElement!==qEl){e.preventDefault();qEl.focus()}});
})();
render();

/* one 64-step hue ramp, rotated per scheme */
const RAMP=[3,8,14,20,25,31,37,42,48,53,59,65,70,76,82,87,93,98,104,110,115,121,127,132,138,143,149,155,160,166,172,177,183,188,194,200,205,211,217,222,228,233,239,245,250,256,262,267,273,278,284,290,295,301,307,312,318,323,329,335,340,346,352,357];
/* palindromic arc — runs out to b and back, so the wrap has no seam and the
   hue never enters the band claimed by the access tags (7°, 11°, 49°, 149°) */
/* a hue ramp weighted toward one end: SPLIT of its length runs hi->mid, the
   rest mid->lo. palindromic — it runs out and back, so the wrap has no seam
   and the hue never leaves the band between lo and hi. */
const mix=(hi,mid,lo,SPLIT)=>Array.from({length:64},(_,i)=>{
  const t=i/64,tri=t<.5?t+t:2-(t+t);
  const h=tri<SPLIT?hi-(tri/SPLIT)*(hi-mid):mid-((tri-SPLIT)/(1-SPLIT))*(mid-lo);
  return Math.round((h+360)%360)});
const SCH={
  /* warm and welcoming: honey through terracotta to a dusty rose. moderate
     saturation on purpose — warm hues at full chroma read as a hazard sign
     rather than lamplight. */
  hearth:{h:mix(52,24,-16,.58),s:[.28,.62],l:[.24,.74]},   /* f defaults to 4.2,12,3 */
  /* the two arc schemes are palindromic — they never leave their band, so they
     can never reach the three tag hues (11° board, 49° staff+board, 149° open).
     the ramp schemes sweep the whole circle and pass through all three. */
  petrol:{h:mix(278,195,6,.68),s:[.36,.82],l:[.20,.72]},  /* blue-led, purple above, tail to red   */
  /* fitted to the dark-navy reference: 82% of the ramp inside a narrow azure
     band, a short warm tail, and a deliberately dark envelope — the reference
     is mostly shadow with bright streaks, not an evenly lit picture */
  slick :{h:mix(224,202,-10,.82),s:[.38,.62],l:[.11,.42]},
  /* the liquid-crystal texture — fine fringes, low chroma — but warmed off the
     photograph's olive. that reference is 43% near-black and 27% olive, which
     is the palette of camouflage; this keeps its fineness and restraint while
     sitting in amber and terracotta. */
  crystal:{h:mix(54,26,-8,.48),s:[.12,.36],l:[.26,.62],f:[4.2,10,4]},
  /* built from the twelve swatches: periwinkle and muted navy at the top,
     down through pine, turquoise and soft moss to olive, camel and warm taupe.
     saturation .10-.30 because the whole palette is muted — mean sat 0.20 */
  sage  :{h:mix(217,145,33,.46),s:[.10,.30],l:[.30,.72]},
  bloom :{h:RAMP.map(h=>(h+42)%360),s:[.22,.46],l:[.36,.80]}, /* hue locked to brightness */
  prism :{h:RAMP,        s:[.26,.66],l:[.38,.78]},   /* full circle, off the leash */
  ash   :{h:mix(278,195,6,.68),s:[.04,.16],l:[.22,.62]}};  /* for presenting                       */
let SK="hearth";

function h2(x,y){const n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)}
function vn(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  return h2(xi,yi)*(1-u)*(1-v)+h2(xi+1,yi)*u*(1-v)+h2(xi,yi+1)*(1-u)*v+h2(xi+1,yi+1)*u*v}
function fbm(x,y,OCT){let s=0,a=.5,f=1,n=0;
  for(let i=0;i<(OCT||3);i++){s+=a*vn(x*f,y*f);n+=a;f*=2.03;a*=.5}
  /* normalised so adding octaves adds detail without changing the overall range */
  return (OCT||3)===3?s:s/n*.875}
function flow(x,y,OCT){
  const q1=fbm(x,y,OCT),q2=fbm(x+5.2,y+1.3,OCT);
  const r1=fbm(x+3.4*q1+1.7,y+3.4*q2+9.2,OCT),r2=fbm(x+3.4*q1+8.3,y+3.4*q2+2.8,OCT);
  return fbm(x+3.2*r1,y+3.2*r2,OCT)}

(function(){
const c=document.getElementById("dz"),x=c.getContext("2d");
const B=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];   /* 4x4 Bayer */
const RED=matchMedia("(prefers-reduced-motion: reduce)").matches;
/* expanding rings dropped at the cursor — position in buffer coords, radius,
   and life 1->0; a small fixed pool, oldest reused */
const RIPN=5,RX=new Float32Array(RIPN),RY=new Float32Array(RIPN),
      RR=new Float32Array(RIPN),RA=new Float32Array(RIPN);
let ripNext=0;
let F=null,TH=null,FW=0,FH=0,FTOT=0,VIEWH=0,DOCH=0,LW=0,LH=0,LQ=3,LQLAST=0,
    OFF=null,OCTX=null,IMG=null,PH=0,GT=null,GN=0,RAFID=0,HC=0,T0=null,
    PRa=null,PGa=null,PBa=null,FLAST=-1e9,PM=3,
    SCALE=4.2,         /* flow-field frequency — pattern density               */
    RINGS=12,          /* ring cycles across the field — gentler tonal slope   */
    OCT=3,             /* fbm octaves — fine structure inside each form        */
    BSCALE=0,BOCT=0,   /* what the current lattice was actually built with      */
    RIPSP=1.5,         /* ripple growth, buffer px per frame                   */
    RIPMAX=210,        /* radius at which a ripple has faded out               */
    RIPW=26,           /* half-width of the expanding band                     */
    RIPAMT=.05,        /* how far it bends the ring phase                      */
    THICK=.15,         /* how far film thickness slides hue along the ramp     */
    CHR0=.62,CHR1=1.35,/* chroma multiplier across thin -> thick regions       */
    LV=24,             /* dither levels — the main grain control (was 8)       */
    GA=3,              /* film-grain amplitude                                  */
    SPAN=.14,          /* fraction of the ramp carried by the bands themselves */
    XSPAN=.24,         /* fraction laid across the screen width — the travel   */
    CYCLE=60000;       /* ms for a hue to cross 1/XSPAN screen widths          */

function buildField(ow,oh){
  LW=Math.max(2,Math.ceil(ow/LQ)+1);LH=Math.max(2,Math.ceil(oh/LQ)+1);
  F=new Float32Array(LW*LH);TH=new Float32Array(LW*LH);
  for(let y=0;y<LH;y++)for(let px=0;px<LW;px++){
    const gx=px*LQ/ow,gy=y*LQ/ow;
    /* SCALE sets how many distinct forms fit across the width. the thickness
       field below deliberately does NOT follow it — its patches stay broad, so
       density comes from the pattern rather than from breaking up the depth */
    F[y*LW+px]=flow(gx*SCALE,gy*SCALE,OCT);
    /* film thickness — a much broader second field, normalised to 0..1 here
       so the per-pixel loop pays nothing for it */
    let t=(flow(gx*1.6+41.7,gy*1.6+18.3)-.33)*3.6;
    TH[y*LW+px]=t<0?0:t>1?1:t}

  OCTX=OFF.getContext("2d");IMG=OCTX.createImageData(ow,VIEWH);

function sample(A,px,gy){
  const u=px/LQ,v=gy/LQ;
  let x0=u|0,y0=v|0;const fx=u-x0,fy2=v-y0;
  if(x0>LW-2)x0=LW-2;if(y0>LH-2)y0=LH-2;if(x0<0)x0=0;if(y0<0)y0=0;
  const i0=y0*LW+x0,i1=i0+LW;

  const t=a+(b-a)*fx,u2=c2+(d-c2)*fx;

function resize(){
  const W=c.offsetWidth,H=c.offsetHeight;if(!W||!H)return;
  c.width=W;c.height=H;x.imageSmoothingEnabled=false;
  const SC=3,ow=Math.ceil(W/SC);

  const otot=Math.min(3000,Math.ceil(DOCH/SC)),oview=Math.ceil(H/SC);

function frame(ts){
  if(ts-FLAST<38){if(!RED)RAFID=requestAnimationFrame(frame);return}
  const dt=FLAST<0?16.7:Math.min(140,ts-FLAST);FLAST=ts;
  const W=c.width,H=c.height;
  if(F&&W&&H){
    const P=PALS[PK],N=P.length-1,A=IMG.data;
    if(!RED)PH+=.0000093*dt;
    if(T0===null)T0=ts;
    const el=(ts-T0)/1000,drift=RED?0:((ts-T0)/CYCLE)%1;

    let ripAny=0;

      RR[k]+=RIPSP*(dt/38);
      RA[k]=1-RR[k]/RIPMAX;

    if(GN--<=0){GN=17;for(let i=0;i<4096;i++)GT[i]=(Math.random()-.5)*GA}
    if(!PRa){PRa=new Float32Array(16);PGa=new Float32Array(16);PBa=new Float32Array(16)}
    for(let i=0;i<=N;i++){PRa[i]=P[i][0];PGa[i]=P[i][1];PBa[i]=P[i][2]}

      const ah=HL[Math.min((am*HLN)|0,HLN-1)];
      window.__h=ah;document.documentElement.style.setProperty("--h",ah)}
    const L0=SC0.l[0],LA=SC0.l[1]-SC0.l[0],S0=SC0.s[0],SA=SC0.s[1]-SC0.s[0];
    let gi=(ts*13)&4095;

  function sync(){const a=ch.offsetHeight,b=st.hidden?0:st.offsetHeight,r=document.documentElement.style;
    r.setProperty("--chh",a+"px");r.setProperty("--stick",(a+b)+"px")}
  window.__sync=sync;sync();
  addEventListener("resize",sync);
  if(window.ResizeObserver){const o=new ResizeObserver(sync);o.observe(ch);o.observe(st)}})();

(function(){const btn=document.getElementById("setbtn"),p=document.getElementById("settings");
  btn.addEventListener("click",()=>{p.hidden=!p.hidden;btn.setAttribute("aria-expanded",String(!p.hidden));
    if(window.__sync)window.__sync()})})();

/* ------------------------------------------------------------------
   shared dropdown behaviour: placement, keyboard, dismissal.
   used by the scheme menu and the access filter.
   ------------------------------------------------------------------ */
/* open toward whichever side has more room, and never run off the edge */
function placeMenu(anchor,menu){
  menu.hidden=false;menu.classList.remove("up");menu.style.maxHeight="";
  const r=anchor.getBoundingClientRect(),h=menu.offsetHeight;
  const below=innerHeight-r.bottom-12,above=r.top-12;
  if(h>below&&above>below){menu.classList.add("up");
    if(h>above)menu.style.maxHeight=above+"px"}
  else if(h>below)menu.style.maxHeight=below+"px"}

function makeMenu(root,btn,menu,onPick){
  const opts=()=>[...menu.querySelectorAll("button[data-v]")];
  let cue=-1;
  const place=()=>placeMenu(btn,menu);

  function mark(){opts().forEach((b,i)=>b.classList.toggle("cue",i===cue))}
  function step(d){const o=opts();if(!o.length)return;
    cue=(cue+d+o.length)%o.length;mark();o[cue].scrollIntoView({block:"nearest"})}
  function away(e){if(!root.contains(e.target))close()}

  function open(){place();btn.setAttribute("aria-expanded","true");
    cue=opts().findIndex(b=>b.getAttribute("aria-selected")==="true");mark();
    addEventListener("pointerdown",away,true);addEventListener("resize",close)}
  function close(){menu.hidden=true;menu.classList.remove("up");menu.style.maxHeight="";
    btn.setAttribute("aria-expanded","false");cue=-1;mark();
    removeEventListener("pointerdown",away,true);removeEventListener("resize",close)}
  function pick(v){onPick(v);close();btn.focus()}

  btn.addEventListener("click",()=>menu.hidden?open():close());
  menu.addEventListener("click",e=>{const b=e.target.closest("button[data-v]");
    if(b)pick(b.dataset.v)});
  btn.addEventListener("keydown",e=>{
    if(e.key==="ArrowDown"||e.key==="ArrowUp"||e.key==="Enter"||e.key===" "){
      e.preventDefault();if(menu.hidden)open();else step(e.key==="ArrowUp"?-1:1)}
    else if(e.key==="Escape"&&!menu.hidden)close()});
  menu.addEventListener("keydown",e=>{
    if(e.key==="Escape"){close();btn.focus()}
    else if(e.key==="ArrowDown"){e.preventDefault();step(1)}
    else if(e.key==="ArrowUp"){e.preventDefault();step(-1)}
    else if(e.key==="Home"){e.preventDefault();cue=0;mark()}
    else if(e.key==="End"){e.preventDefault();cue=opts().length-1;mark()}
    else if(e.key==="Enter"||e.key===" "){e.preventDefault();
      const o=opts();if(cue>=0)pick(o[cue].dataset.v)}});
  return{close,isOpen:()=>!menu.hidden}}

/* colour schemes — modes carry a spread preset, palettes change hue only */
(function(){
  const root=document.getElementById("mode"),btn=document.getElementById("modebtn"),
        menu=document.getElementById("modemenu"),lbl=document.getElementById("modelbl"),
        chip=document.getElementById("modesw");
  /* ordered best-first for this page: quiet enough that the access tags stay
     the thing you notice, and clear of all three tag hues */
  const PRESETS=["sage","hearth","slick","crystal","petrol","bloom","prism"];
  const SPREAD_OF={hearth:[.14,.24],sage:[.14,.24],petrol:[.14,.24],slick:[.14,.24],crystal:[.14,.24],bloom:[.96,.12],prism:[.14,.24]};
  const REST=Object.keys(SCH).filter(k=>PRESETS.indexOf(k)<0);

  function swatch(k){const S=SCH[k],st=[];
    for(let i=0;i<7;i++){const t=i/6,hi=Math.min((t*S.h.length)|0,S.h.length-1);
      const L=S.l[0]+Math.sqrt(t)*(S.l[1]-S.l[0]),sa=S.s[0]+t*(S.s[1]-S.s[0]);
      st.push("hsl("+S.h[hi]+" "+(sa*100).toFixed(0)+"% "+(L*100).toFixed(0)+"%) "+Math.round(t*100)+"%")}
    return "linear-gradient(90deg,"+st.join(",")+")"}

  const item=k=>'<button type="button" role="option" data-v="'+k+'" aria-selected="'+(k===SK)+'">'+
    '<i class="ms" style="background:'+swatch(k)+'"></i>'+k+'</button>';
  /* density is a separate axis, so it rides under the list instead of doubling
     it — nine colours x two densities from ten controls rather than eighteen */
  menu.innerHTML=PRESETS.map(item).join("")+
    (REST.length?'<hr class="sep">'+REST.map(item).join(""):"")+
    '<hr class="sep"><button type="button" class="dsw" id="densebtn" aria-pressed="false">'+
    '<i class="bx"></i>dense</button>';

  function setScheme(k,preset){
    if(!SCH[k])return;
    SK=k;
    if(preset&&SPREAD_OF[k]&&window.setSpread){
      window.setSpread(SPREAD_OF[k][0],SPREAD_OF[k][1]);
      if(window.__syncSpread)window.__syncSpread(SPREAD_OF[k][0],SPREAD_OF[k][1])}
    /* a scheme may bring its own pattern; dense multiplies whatever it is */
    applyField()
    lbl.textContent=k;chip.style.background=swatch(k);
    menu.querySelectorAll("button[data-v]").forEach(b=>
      b.setAttribute("aria-selected",String(b.dataset.v===k)));
    if(window.__redraw)window.__redraw()}
  let DENSE=false;
  function applyField(){
    if(!window.setField)return;
    const f=SCH[SK].f||[4.2,12,3];
    /* the same step that separated bloom from its dense variant */
    window.setField(DENSE?f[0]*1.19:f[0], DENSE?Math.round(f[1]*1.33):f[1], f[2])}
  window.setScheme=setScheme;
  setScheme(SK,false);
  const dbtn=menu.querySelector("#densebtn");
  dbtn.addEventListener("click",e=>{
    e.stopPropagation();
    DENSE=!DENSE;
    dbtn.setAttribute("aria-pressed",String(DENSE));
    dbtn.querySelector(".bx").classList.toggle("on",DENSE);
    applyField()});
  makeMenu(root,btn,menu,k=>setScheme(k,true));
})();

/* access filter */
(function(){
  const root=document.getElementById("filt"),btn=document.getElementById("filtbtn"),
        menu=document.getElementById("filtmenu");
  makeMenu(root,btn,menu,v=>{tier=v;render()});
})();

/* field shapes */
(function(){const r=document.getElementById("prow");
  const M=[[0,"sweep"],[1,"split"],[2,"radial"],[3,"chromatic"],[4,"crossed"]];
  r.innerHTML=M.map(([i,n])=>'<button type="button" class="mkb" data-p2="'+i+'" aria-pressed="'+(i===3)+'">'+n+'</button>').join("");
  r.addEventListener("click",e=>{const b=e.target.closest(".mkb");if(!b)return;
    window.setPrism(+b.dataset.p2);
    r.querySelectorAll(".mkb").forEach(s=>s.setAttribute("aria-pressed",String(s.dataset.p2===b.dataset.p2)))})})();

/* how much of the spectrum sits on screen at once */
(function(){const r=document.getElementById("srow");
  const M=[[.08,.14,"tight"],[.14,.24,"arc"],[.26,.45,"broad"],[.5,1,"full"]];
  r.innerHTML=M.map(([a,b,n])=>'<button type="button" class="mkb" data-s="'+a+'" data-x="'+b+'" aria-pressed="'+(n==="arc")+'">'+n+'</button>').join("");
  r.addEventListener("click",e=>{const b=e.target.closest(".mkb");if(!b)return;
    window.setSpread(+b.dataset.s,+b.dataset.x);
    r.querySelectorAll(".mkb").forEach(s=>s.setAttribute("aria-pressed",String(s===b)))});
  /* a tab preset can set a spread that isn't one of these four — then none show */
  window.__syncSpread=(a,b)=>r.querySelectorAll(".mkb").forEach(x=>
    x.setAttribute("aria-pressed",String(+x.dataset.s===a&&+x.dataset.x===b)))})();

/* dither coarseness — what reads as graininess */
(function(){const r=document.getElementById("grow");
  const M=[[32,0,"smooth"],[24,3,"fine"],[12,6,"dither"],[8,9,"raw"]];
  r.innerHTML=M.map(([lv,ga,n])=>'<button type="button" class="mkb" data-lv="'+lv+'" data-ga="'+ga+
    '" aria-pressed="'+(n==="fine")+'">'+n+'</button>').join("");
  r.addEventListener("click",e=>{const b=e.target.closest(".mkb");if(!b)return;
    window.setGrain(+b.dataset.lv,+b.dataset.ga);
    r.querySelectorAll(".mkb").forEach(x=>x.setAttribute("aria-pressed",String(x===b)))})})();

/* film thickness — broad patches that shift hue within the arc and vary chroma */
(function(){const r=document.getElementById("drow");
  const M=[[0,1,1,"flat"],[.08,.80,1.15,"light"],[.15,.62,1.35,"medium"],[.24,.45,1.55,"strong"]];
  r.innerHTML=M.map(([t,a,b,n])=>'<button type="button" class="mkb" data-t="'+t+'" data-a="'+a+
    '" data-b="'+b+'" aria-pressed="'+(n==="medium")+'">'+n+'</button>').join("");
  r.addEventListener("click",e=>{const b=e.target.closest(".mkb");if(!b)return;
    window.setDepth(+b.dataset.t,+b.dataset.a,+b.dataset.b);
    r.querySelectorAll(".mkb").forEach(x=>x.setAttribute("aria-pressed",String(x===b)))})})();

/* header surface — flush shares the rail's panel, solid makes both bars opaque */
(function(){const r=document.getElementById("hrow"),H=document.documentElement;
  const M=[["flush","flush"],["solid","solid"]];
  r.innerHTML=M.map(([v,n])=>'<button type="button" class="mkb" data-h="'+v+
    '" aria-pressed="'+(H.dataset.hdr===v)+'">'+n+'</button>').join("");
  r.addEventListener("click",e=>{const b=e.target.closest(".mkb");if(!b)return;
    H.dataset.hdr=b.dataset.h;
    r.querySelectorAll(".mkb").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  })})();

/* copy to clipboard — with the execCommand fallback, because this page is
   opened from file:// where the async clipboard API isn't always available */
function copyText(t,btn,label){
  const flash=()=>{const o=btn.textContent;btn.textContent=label||"copied";btn.classList.add("ok");
    setTimeout(()=>{btn.textContent=o;btn.classList.remove("ok")},1200)};
  const legacy=()=>{const ta=document.createElement("textarea");ta.value=t;
    ta.setAttribute("readonly","");ta.style.cssText="position:fixed;top:0;left:-9999px;opacity:0";
    document.body.appendChild(ta);ta.select();
    let done=false;try{done=document.execCommand("copy")}catch(e){}
    document.body.removeChild(ta);if(done)flash()};
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(t).then(flash,legacy);
  else legacy()}
window.__copyText=copyText;

/* per-row copy, delegated so it survives every re-render */
document.getElementById("res").addEventListener("click",e=>{
  const b=e.target.closest(".cp");if(!b)return;
  e.preventDefault();e.stopPropagation();
  copyText(b.dataset.u,b,"copied")});

/* copy the list exactly as it is on screen — filter and search included */
(function(){const btn=document.getElementById("copyall");
  btn.addEventListener("click",()=>{
    const lines=[];
    D.forEach(sec=>{
      const ds=sec.d.filter(match);if(!ds.length)return;
      lines.push(sec.s+"  "+sec.h.toUpperCase());
      ds.forEach(d=>lines.push("  "+d.t+"  ("+TL[d.x]+")","  "+d.u));
      lines.push("")});
    copyText(lines.join("\n").trim()||"(no match)",btn,"copied")})})();

/* hover prism follows the cursor across a row */
(function(){const res=document.getElementById("res");
  let raf=0,el=null,fx=0;
  function apply(){raf=0;if(!el)return;
    el.style.setProperty("--mx",(fx*100).toFixed(1)+"%");
    el.style.setProperty("--mh",(((fx*300)+(window.__h||0))%360).toFixed(0))}
  res.addEventListener("mousemove",e=>{
    const a=e.target.closest?e.target.closest(".doc"):null;if(!a)return;
    const r=a.getBoundingClientRect();
    fx=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));el=a;
    if(!raf)raf=requestAnimationFrame(apply)},{passive:true});
  res.addEventListener("mouseleave",()=>{el=null},{passive:true})})();

/* clock */
(function(){const el=document.getElementById("clk");
  const tick=()=>{const d=new Date(),off=-d.getTimezoneOffset()/60;
    el.textContent=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+
      " ("+(off>=0?"+":"")+off+")"};
  tick();setInterval(tick,1000)})();
</script>
